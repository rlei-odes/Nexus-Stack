# Nexus-Stack default Postgres source.
#
# Connection options are literal here, NOT ${VAR} placeholders:
# Evidence applies ${VAR} interpolation to query files, not to
# connection.yaml, so placeholders would reach the driver as literal
# strings (a ${POSTGRES_PORT} port parses to NaN and the source fails
# to connect). Secrets are injected from the environment instead, via
# EVIDENCE_SOURCE__<source name>__<option>, which the compose file
# sets for `password` from the Infisical-rendered .env.
#
# Add more sources by creating sibling directories under
# stacks/evidence/project/sources/<name>/ with their own
# connection.yaml, and register the driver package under
# `plugins.datasources` in evidence.config.yaml. Place .sql query
# files alongside it; Evidence discovers both on `npm run sources`.
name: nexus_postgres
type: postgres
options:
  host: postgres
  port: 5432
  database: postgres
  user: nexus-postgres
  schema: public
  ssl: false
